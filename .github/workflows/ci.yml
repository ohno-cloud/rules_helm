name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bazel: [9.1.0, 9.3.2]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: go test -race ./...
      - run: bazel run //:gazelle -- -mode=diff
      - run: bazel test //...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.12.7
          args: check
      - name: Build development helper
        run: go build -o "$RUNNER_TEMP/helmlock" ./cmd/helmlock
      - name: Test extension, repository caching, and CRD extraction
        run: go test ./tools/extensiontest -resolver "$RUNNER_TEMP/helmlock" -count=1
      - name: Verify release artifacts
        if: startsWith(github.head_ref, 'release/v') || startsWith(github.ref_name, 'release/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir promoted
          snapshot=$(jq -r .tag private/helmlock.json)
          source=$(jq -r .source_commit private/helmlock.json)
          gh release download "$snapshot" --dir promoted
          go run ./tools/pinhelmlock verify --artifacts promoted
          git diff --exit-code "$source" HEAD -- cmd/helmlock go.mod go.sum .goreleaser.yaml
          chmod +x promoted/helmlock-linux-amd64
          go test ./tools/extensiontest -resolver "$PWD/promoted/helmlock-linux-amd64" -count=1
