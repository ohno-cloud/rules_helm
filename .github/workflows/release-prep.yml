name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Rules version without a leading v (for example 0.5.0)
        type: string
        required: true

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download and pin latest main snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          source=$(git rev-parse HEAD)
          tag="v0.0.0-main.${source}"
          mkdir "$RUNNER_TEMP/promoted"
          gh release download "$tag" --dir "$RUNNER_TEMP/promoted"
          go run ./tools/pinhelmlock pin --artifacts "$RUNNER_TEMP/promoted" --tag "$tag" --version "$RELEASE_VERSION"
          if git rev-parse --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release tag already exists"
            exit 1
          fi
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        id: pr
        with:
          branch: release/v${{ inputs.version }}
          commit-message: Prepare release v${{ inputs.version }}
          title: Release v${{ inputs.version }}
          body: Pins the latest published main helper artifacts and checksums. Merge to tag and publish these exact binaries without rebuilding.
          add-paths: |
            MODULE.bazel
            private/helmlock.json
      - name: Run checks for the bot-created PR
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh workflow run ci.yml --ref "release/v${RELEASE_VERSION}"
